name: Verify packaged PutmanCode beta updates
on:
  push:
    branches: ['verify/desktop-beta-*']

permissions:
  contents: read
  actions: read

jobs:
  inputs:
    outputs:
      previous: ${{ steps.collect.outputs.previous }}
    runs-on: ubuntu-24.04
    # GitHub shows a draft to release editors. Only this download job needs that permission.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false
      - name: Collect the draft and previous public installers
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version' apps/desktop/package.json)
          repo="$GITHUB_REPOSITORY"
          draft=$(gh release view "v$version" --repo "$repo" --json isDraft,targetCommitish)
          sha=$(jq -er 'select(.isDraft) | .targetCommitish' <<<"$draft")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$sha" != "$GITHUB_SHA" ]]; then
            git fetch --no-tags --depth=1 origin "$sha"
            git diff --exit-code "$sha" HEAD -- . ':!scripts/verify-putmancode-beta-upgrade.mjs' ':!.github/workflows/putmancode-beta-upgrade.yml'
          fi
          run=$(gh run list --repo "$repo" --workflow putmancode-desktop-release-build.yml --commit "$sha" --branch release/1.0.0 --status success --json databaseId --jq '.[0].databaseId')
          test -n "$run"
          gh release download "v$version" --repo "$repo" --pattern SHA256SUMS
          assets=$(gh release view "v$version" --repo "$repo" --json assets)
          for arch in x64 arm64; do
            file="t3-$version-linux-$arch.tar.gz"
            digest=$(jq -er --arg file "$file" '.assets[] | select(.name == $file) | .digest | select(startswith("sha256:"))' <<<"$assets")
            grep -Fx "${digest#sha256:}  $file" SHA256SUMS
          done
          gh release download "v$version" --repo "$repo" --dir mac --pattern '*-arm64.zip*' --pattern 'beta-mac.yml'
          gh release download "v$version" --repo "$repo" --dir windows --pattern '*.exe*' --pattern 'beta.yml'
          [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-beta\.([1-9][0-9]*)$ ]]
          previous="${BASH_REMATCH[1]}-beta.$((BASH_REMATCH[2] - 1))"
          gh release view "v$previous" --repo "$repo" --json isDraft,isPrerelease | jq -e '.isPrerelease and (.isDraft | not)' >/dev/null
          gh release download "v$previous" --repo "$repo" --dir mac/previous --pattern "PutmanCode-$previous-macOS-arm64.dmg"
          gh release download "v$previous" --repo "$repo" --dir windows/previous --pattern "Putman-Code-$previous-x64.exe"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-upgrade-inputs
          path: mac/
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-upgrade-inputs
          path: windows/
          retention-days: 2
          compression-level: 0

  upgrade:
    needs: inputs
    env:
      PREVIOUS_VERSION: ${{ needs.inputs.outputs.previous }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
          - os: windows-2025
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            /apps/desktop/package.json
            /scripts/verify-putmancode-beta-upgrade.mjs
            /scripts/fixtures/desktop-launch/statev2.sqlite
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.platform }}-upgrade-inputs
          path: feed
      - name: Install native test tools in isolation
        shell: bash
        run: |
          mkdir verification
          cp scripts/verify-putmancode-beta-upgrade.mjs verification/
          pw=$(node -p 'require("./apps/desktop/package.json").dependencies["playwright-core"]')
          cd verification
          npm install --no-audit --no-fund --ignore-scripts "playwright-core@$pw" "@electron/asar@4.3.0"
      - name: Upgrade the installed Windows app and confirm relaunch
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $previous = (Get-Item feed/previous/*.exe).FullName
          $target = Join-Path $env:LOCALAPPDATA 'Programs\PutmanCodeBetaVerification'
          $result = Start-Process -FilePath $previous -ArgumentList @('/S', "/D=$target") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Baseline installation failed" }
          node verification/verify-putmancode-beta-upgrade.mjs "$target\PutmanCode.exe" (Resolve-Path feed).Path $version $env:PREVIOUS_VERSION
      - name: Upgrade the installed Mac app and confirm relaunch
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./apps/desktop/package.json").version')
          mkdir -p "$RUNNER_TEMP/previous-app" "$RUNNER_TEMP/new-app"
          mount="$RUNNER_TEMP/previous-install-image"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "feed/previous/PutmanCode-$PREVIOUS_VERSION-macOS-arm64.dmg"
          trap 'hdiutil detach "$mount" -force >/dev/null' EXIT
          ditto "$mount/PutmanCode.app" "$RUNNER_TEMP/previous-app/PutmanCode.app"
          ditto -x -k "feed/Putman-Code-$version-arm64.zip" "$RUNNER_TEMP/new-app"
          previous="$RUNNER_TEMP/previous-app/PutmanCode.app"
          candidate="$RUNNER_TEMP/new-app/PutmanCode.app"
          requirement=$(codesign -dr- "$previous" 2>&1 | sed -n 's/^designated => //p')
          [[ "$requirement" == *"certificate leaf"* ]]
          codesign --verify --deep --strict -R="$requirement" "$candidate"
          if codesign --verify -R="$requirement" /usr/bin/true 2>/dev/null; then exit 1; fi
          node verification/verify-putmancode-beta-upgrade.mjs "$previous/Contents/MacOS/PutmanCode" "$PWD/feed" "$version" "$PREVIOUS_VERSION"
          image="$RUNNER_TEMP/PutmanCode-$version-macOS-arm64.dmg"
          ln -s /Applications "$RUNNER_TEMP/new-app/Applications"
          hdiutil create -quiet -volname "PutmanCode $version" -srcfolder "$RUNNER_TEMP/new-app" -format UDZO "$image"
          hdiutil verify "$image"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success() && runner.os == 'macOS'
        with:
          name: verified-beta-dmg
          path: ${{ runner.temp }}/PutmanCode-*-macOS-arm64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
