name: Attach verified DMG to the Beta 11 draft
on:
  push:
    branches: [ops/beta11-complete-draft]
permissions:
  contents: write
  actions: read
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check both updater runs and complete the unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-beta11/stage-image.py
