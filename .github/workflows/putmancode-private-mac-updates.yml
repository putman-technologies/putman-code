name: Verify private Mac updates
on:
  push:
    branches: [feature/private-mac-updates]
    paths:
      - "scripts/private-mac-updates/**"
      - ".github/workflows/putmancode-private-mac-updates.yml"
permissions:
  contents: read
jobs:
  signed-update:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: scripts/private-mac-updates
      - name: Install the release test driver
        working-directory: scripts/private-mac-updates
        run: npm install --ignore-scripts --no-save --prefix "$RUNNER_TEMP/test-driver" playwright-core@1.64.1
      - name: Sign two released betas and install through PutmanCode
        working-directory: scripts/private-mac-updates
        env:
          NODE_PATH: ${{ runner.temp }}/test-driver/node_modules
        run: /usr/bin/python3 verify.py
