name: PutmanCode review
on: pull_request
permissions:
  contents: read
jobs:
  visual:
    name: Visual acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test the feature against synthetic fixtures and capture its screenshots
        env:
          REVIEW_REVISION: ${{ github.event.pull_request.head.sha }}
        run: .github/putmancode/review "$REVIEW_REVISION" "$RUNNER_TEMP/review"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: evidence
        with:
          name: review-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/review/*.png
          if-no-files-found: error
      - name: Link the screenshots
        env:
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
          REVISION: ${{ github.event.pull_request.head.sha }}
        run: printf '[Review screenshots for %s](%s)\n' "$REVISION" "$EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"
